<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Chibi-Scheme</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap');
      
      body {
        font-family: 'JetBrains Mono', monospace;
        height: 100vh;
        margin: 0;
        padding: 0;
        background-color: #1a1a1a;
        color: #ffffff;
        overflow: hidden;
      }
      
      .container {
        height: 100vh;
        display: grid;
        grid-template-columns: 1fr 800px;
        grid-template-rows: 1fr 15%;
        grid-template-areas: 
          "editor canvas"
          "output output";
        gap: 0;
      }
      
      .editor-section {
        grid-area: editor;
        display: flex;
        flex-direction: column;
        background-color: #2d2d2d;
        border-right: 2px solid #444;
      }
      
      .editor-header {
        padding: 10px 15px;
        background-color: #3d3d3d;
        border-bottom: 1px solid #444;
        font-weight: 500;
        font-size: 14px;
        position: relative;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      
      .editor-container {
        flex: 1;
        position: relative;
      }
      
      #program {
        width: 100%;
        height: 100%;
        border: none;
        outline: none;
        background-color: #2d2d2d;
        color: #ffffff;
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        line-height: 1.5;
        padding: 15px;
        resize: none;
        box-sizing: border-box;
      }
      
      .canvas-section {
        grid-area: canvas;
        position: relative;
        background-color: #000;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      canvas {
        border: 0px none;
        background-color: black;
        width: 800px;
        height: 600px;
        display: block;
      }
      
      .scheme-logo {
        position: absolute;
        top: 20px;
        right: 20px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 24px;
        font-weight: 700;
        color: #4CAF50;
        opacity: 0.3;
        pointer-events: none;
        z-index: 1;
      }
      
      .output-section {
        grid-area: output;
        background-color: #1a1a1a;
        border-top: 2px solid #444;
        display: flex;
        flex-direction: column;
      }
      
      .output-header {
        padding: 8px 15px;
        background-color: #3d3d3d;
        border-bottom: 1px solid #444;
        font-weight: 500;
        font-size: 12px;
        color: #888;
      }
      
      #output {
        flex: 1;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        padding: 10px 15px;
        white-space: pre;
        background-color: #1a1a1a;
        color: #ffffff;
        overflow: auto;
        border: none;
        outline: none;
        resize: none;
      }
      
      #start {
        background-color: #4CAF50;
        color: white;
        border: none;
        padding: 8px 16px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        font-weight: 500;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.2s;
        margin-left: auto;
      }
      
      #start:hover {
        background-color: #45a049;
      }
      
      #start:disabled {
        background-color: #666;
        cursor: not-allowed;
      }
      
      /* CodeMirror custom styling */
      .CodeMirror {
        height: 100%;
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        line-height: 1.5;
      }
      
      .CodeMirror-gutters {
        background-color: #2d2d2d;
        border-right: 1px solid #444;
      }
      
      .CodeMirror-linenumber {
        color: #888;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="editor-section">
        <div class="editor-header">
          Scheme Editor
          <button type="button" id="start" disabled>Start Program</button>
        </div>
        <div class="editor-container">
          <textarea id="program" spellcheck="false">
(import (scheme base) (robj gameengine))

(define (initialize)
  (write-string "Init\n") (newline))

(define (update) (newline))

(define (render)
  (draw-lines! "Hola"))
          </textarea>
        </div>
      </div>
      
      <div class="canvas-section">
        <canvas id="canvas"></canvas>
        <div class="scheme-logo">λ</div>
      </div>
      
      <div class="output-section">
        <div class="output-header">Output</div>
        <div id="output"></div>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/scheme/scheme.min.js"></script>
    <script src="chibi.js"></script>
    <script>
      function start(program, args, onOutput, onError) {
        var firstError = true;
        Chibi({
          print: onOutput,
          printErr: onOutput,
          canvas: document.getElementById('canvas'),
          program: program,
          arguments: args
        });
      }
    </script>
    <script>
      (function () {
        var programField = document.querySelector('#program');
        var startButton = document.querySelector('#start');
        var output = document.querySelector('#output');
        
        // Initialize CodeMirror for syntax highlighting
        var editor = CodeMirror.fromTextArea(programField, {
          mode: 'scheme',
          theme: 'monokai',
          lineNumbers: true,
          indentUnit: 2,
          smartIndent: true,
          electricChars: true,
          matchBrackets: true,
          autoCloseBrackets: true,
          styleActiveLine: true,
          lineWrapping: false,
          foldGutter: true,
          gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter"]
        });
        
        // Load saved program
        var program = sessionStorage.getItem('program');
        if (program) {
          editor.setValue(program);
        }
        
        // Save program on change
        editor.on('change', function() {
          sessionStorage.setItem('program', editor.getValue());
        });
        
        startButton.addEventListener('click', function() {
          var program = editor.getValue();
          start(program, [],
                function(text) {
                  console.log(text);
                  output.textContent = output.textContent + text + '\n';
                });
        });
        
        startButton.disabled = false;
      })();
    </script>
  </body>
</html>
